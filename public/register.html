<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js" defer></script>
<title>新規登録｜ひとり旅ジャパン</title>
<script src="/js/auth-pages.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <form class="auth-wrap form-grid" id="login-form" data-mode="register" novalidate>
    <div>
      <h1>新規登録</h1>
      <p class="hint">無料で登録できます。メールアドレスは公開されません。</p>
    </div>
    <p class="alert alert-error" id="auth-error" hidden></p>
    <div class="field">
      <label for="displayName">ニックネーム（ブログに表示されます）</label>
      <input class="input" id="displayName" name="displayName" maxlength="40" autocomplete="nickname" required>
    </div>
    <div class="field">
      <label for="email">メールアドレス</label>
      <input class="input" type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <div class="pw-wrap">
        <input class="input" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-hint">
        <button type="button" class="pw-toggle" aria-label="パスワードの表示切替">表示</button>
      </div>
      <p class="hint" id="pw-hint">8文字以上で、英字と数字を両方含めてください。</p>
    </div>
    <button class="btn btn-primary btn-lg" type="submit">登録してはじめる</button>
    <p class="auth-foot">すでにアカウントをお持ちの方は <a href="/login" id="switch-link">ログイン</a></p>
  </form>
</main>
<div id="site-footer"></div>
</body>
</html>
