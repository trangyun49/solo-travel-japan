<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/i18n.js" defer></script>
<script src="/js/common.js" defer></script>
<title data-i18n="t_blog">ブログ・旅のヒント｜ひとり旅ジャパン</title>
<meta name="description" content="日本のひとり旅に役立つコツ、グルメ、季節の観光情報、旅人の体験記。">
<script src="/js/blog.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-head">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h1 data-i18n="blog_title">ブログ・旅のヒント</h1>
          <p data-i18n="blog_lead">編集部の旅ガイドと、旅人が投稿した体験記。あなたのひとり旅の話も投稿できます。</p>
        </div>
        <a class="btn btn-primary" href="/write" data-icon="pen" data-i18n="write_btn">体験記を書く</a>
      </div>
    </div>
  </div>
  <div class="wrap section">
    <form class="filters filters-inline" id="post-filters" role="search" aria-label="記事の絞り込み">
      <div class="chips" data-group="category">
        <button type="button" class="chip" data-value="" data-i18n="all">すべて</button>
        <button type="button" class="chip" data-value="solo" data-i18n="pcat_solo">ひとり旅</button>
        <button type="button" class="chip" data-value="tips" data-i18n="pcat_tips">旅のコツ</button>
        <button type="button" class="chip" data-value="gourmet" data-i18n="pcat_gourmet">グルメ</button>
        <button type="button" class="chip" data-value="sightseeing" data-i18n="pcat_sightseeing">観光</button>
        <button type="button" class="chip" data-value="experience" data-i18n="pcat_experience">体験記</button>
      </div>
      <div class="filter-selects">
        <label class="sr-only" for="season" data-i18n="season">季節</label>
        <select class="select" id="season">
          <option value="" data-i18n="season_any">季節：すべて</option>
          <option value="spring" data-i18n="season_spring">春</option><option value="summer" data-i18n="season_summer">夏</option><option value="autumn" data-i18n="season_autumn">秋</option><option value="winter" data-i18n="season_winter">冬</option>
        </select>
        <label class="sr-only" for="region" data-i18n="area">エリア</label>
        <select class="select" id="region"><option value="" data-i18n="area_any">エリア：すべて</option></select>
        <label class="sr-only" for="source" data-i18n="author_any">投稿者</label>
        <select class="select" id="source">
          <option value="" data-i18n="author_any">投稿者：すべて</option><option value="editorial" data-i18n="author_ed">編集部</option><option value="community" data-i18n="author_users">旅人の投稿</option>
        </select>
        <label class="sr-only" for="q" data-i18n="keyword">キーワード</label>
        <input class="input" type="search" id="q" placeholder="キーワード" data-i18n-ph="keyword" maxlength="50">
      </div>
    </form>
    <div id="posts" aria-live="polite"><div class="spinner" role="status" aria-label="読み込み中"></div></div>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
