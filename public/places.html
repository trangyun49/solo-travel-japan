<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/i18n.js" defer></script>
<script src="/js/common.js" defer></script>
<title data-i18n="t_places">スポットを探す｜Solo Travel Japan</title>
<meta name="description" data-i18n-content="meta_places" content="季節・月・エリア・カテゴリから、ひとり旅におすすめの観光スポット、グルメ、カフェ、温泉を探せます。">
<script src="/js/places.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-head">
    <div class="wrap">
      <h1 id="page-title" data-i18n="places_title">スポットを探す</h1>
      <p data-i18n="places_lead">季節やエリアで絞り込んで、ひとり旅で行きたい場所を見つけましょう。●の数はひとり旅のしやすさ（5段階）です。</p>
    </div>
  </div>
  <div class="wrap section">
    <div class="layout-side">
      <form class="filters collapsed" id="filters" role="search" aria-label="スポットの絞り込み" data-i18n-aria="filter_places">
        <div class="field">
          <label for="q" data-i18n="keyword">キーワード</label>
          <input class="input" type="search" id="q" name="q" placeholder="例：京都、ラーメン、夜景" data-i18n-ph="keyword_ph" maxlength="50">
        </div>
        <div>
          <h2 class="mb" data-i18n="category">カテゴリ</h2>
          <div class="chips" data-group="category">
            <button type="button" class="chip" data-value="" data-i18n="all">すべて</button>
            <button type="button" class="chip" data-value="sightseeing" data-i18n="cat_sightseeing">観光スポット</button>
            <button type="button" class="chip" data-value="gourmet" data-i18n="cat_gourmet">グルメ</button>
            <button type="button" class="chip" data-value="cafe" data-i18n="cat_cafe">カフェ</button>
            <button type="button" class="chip" data-value="onsen" data-i18n="cat_onsen">温泉</button>
          </div>
        </div>
        <div>
          <h2 class="mb" data-i18n="area">エリア</h2>
          <div class="chips" data-group="region">
            <button type="button" class="chip" data-value="" data-i18n="nationwide">全国</button>
            <button type="button" class="chip" data-value="hokkaido" data-i18n="region_hokkaido">北海道</button>
            <button type="button" class="chip" data-value="tohoku" data-i18n="region_tohoku">東北</button>
            <button type="button" class="chip" data-value="kanto" data-i18n="region_kanto">関東</button>
            <button type="button" class="chip" data-value="chubu" data-i18n="region_chubu">中部</button>
            <button type="button" class="chip" data-value="kansai" data-i18n="region_kansai">関西</button>
            <button type="button" class="chip" data-value="chugoku" data-i18n="region_chugoku">中国</button>
            <button type="button" class="chip" data-value="shikoku" data-i18n="region_shikoku">四国</button>
            <button type="button" class="chip" data-value="kyushu" data-i18n="region_kyushu">九州</button>
            <button type="button" class="chip" data-value="okinawa" data-i18n="region_okinawa">沖縄</button>
          </div>
        </div>
        <div>
          <h2 class="mb" data-i18n="season">季節</h2>
          <div class="chips" data-group="season">
            <button type="button" class="chip" data-value="" data-i18n="season_all">通年</button>
            <button type="button" class="chip" data-value="spring" data-i18n="season_spring">春</button>
            <button type="button" class="chip" data-value="summer" data-i18n="season_summer">夏</button>
            <button type="button" class="chip" data-value="autumn" data-i18n="season_autumn">秋</button>
            <button type="button" class="chip" data-value="winter" data-i18n="season_winter">冬</button>
          </div>
        </div>
        <div class="field">
          <label for="month" data-i18n="by_month">月で選ぶ</label>
          <select class="select" id="month" name="month">
            <option value="" data-i18n="any_month">指定しない</option>
          </select>
        </div>
        <label class="toggle"><input type="checkbox" id="solo"> <span data-i18n="only_solo">ひとり旅に特におすすめ（●5）のみ</span></label>
        <label class="toggle"><input type="checkbox" id="featured"> <span data-i18n="only_featured">編集部のおすすめのみ</span></label>
        <button type="button" class="btn btn-outline" id="reset" data-i18n="reset">条件をリセット</button>
      </form>

      <div>
        <div class="result-bar">
          <p id="count" aria-live="polite"></p>
          <button type="button" class="btn btn-outline btn-sm filter-toggle" id="filter-toggle" aria-controls="filters" aria-expanded="false" data-icon="filter" data-i18n="filters">絞り込み</button>
        </div>
        <div class="grid" id="list"><div class="spinner" role="status" aria-label="読み込み中" data-i18n-aria="loading"></div></div>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
