<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js" defer></script>
<title>マイページ｜ひとり旅ジャパン</title>
<script src="/js/account.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-head">
    <div class="wrap">
      <h1>マイページ</h1>
      <p>プロフィール、お気に入り、検索履歴、投稿した記事を管理できます。</p>
    </div>
  </div>
  <div class="wrap section">
    <div class="account-layout" id="account" hidden>
      <nav class="account-nav" role="tablist" aria-label="マイページメニュー">
        <button role="tab" data-tab="profile" aria-selected="true" data-icon="user">プロフィール</button>
        <button role="tab" data-tab="favorites" aria-selected="false" data-icon="heart">お気に入り</button>
        <button role="tab" data-tab="history" aria-selected="false" data-icon="clock">検索履歴</button>
        <button role="tab" data-tab="posts" aria-selected="false" data-icon="pen">投稿した記事</button>
        <button role="tab" data-tab="security" aria-selected="false" data-icon="lock">セキュリティ</button>
        <button type="button" id="logout-btn">ログアウト</button>
      </nav>

      <div>
        <section class="account-panel" data-panel="profile" role="tabpanel">
          <div class="profile-top">
            <span class="avatar" id="p-avatar"></span>
            <div>
              <h2 id="p-name" class="mb0"></h2>
              <div class="stats"><span><b id="s-fav">0</b>お気に入り</span><span><b id="s-posts">0</b>投稿</span><span id="p-since"></span></div>
            </div>
          </div>
          <form class="form-grid" id="profile-form" novalidate>
            <p class="alert" id="profile-msg" hidden></p>
            <div class="form-row">
              <div class="field">
                <label for="displayName">ニックネーム</label>
                <input class="input" id="displayName" maxlength="40" required>
              </div>
              <div class="field">
                <label for="email">メールアドレス（変更不可）</label>
                <input class="input" id="email" disabled>
              </div>
            </div>
            <div class="field">
              <label for="homeCity">いつもの出発地</label>
              <select class="select" id="homeCity"><option value="">指定しない</option></select>
              <p class="hint">旅の検索フォームの出発地に自動で入ります。</p>
            </div>
            <div class="field">
              <label for="bio">自己紹介（300文字まで）</label>
              <textarea class="textarea textarea-sm" id="bio" maxlength="300"></textarea>
            </div>
            <div><button class="btn btn-primary" type="submit">プロフィールを保存</button></div>
          </form>
        </section>

        <section class="account-panel" data-panel="favorites" role="tabpanel" hidden>
          <h2>お気に入りのスポット</h2>
          <div class="grid" id="fav-list"></div>
        </section>

        <section class="account-panel" data-panel="history" role="tabpanel" hidden>
          <div class="result-bar"><h2 class="mb0">検索履歴</h2><button class="btn btn-outline btn-sm" type="button" id="clear-history">履歴を削除</button></div>
          <div id="history-list"></div>
        </section>

        <section class="account-panel" data-panel="posts" role="tabpanel" hidden>
          <div class="result-bar"><h2 class="mb0">投稿した記事</h2><a class="btn btn-primary btn-sm" href="/write">新しく書く</a></div>
          <div id="post-list"></div>
        </section>

        <section class="account-panel" data-panel="security" role="tabpanel" hidden>
          <h2>パスワードの変更</h2>
          <form class="form-grid" id="pw-form" novalidate>
            <p class="alert" id="pw-msg" hidden></p>
            <div class="field">
              <label for="currentPassword">現在のパスワード</label>
              <div class="pw-wrap"><input class="input" type="password" id="currentPassword" autocomplete="current-password" required><button type="button" class="pw-toggle">表示</button></div>
            </div>
            <div class="field">
              <label for="newPassword">新しいパスワード</label>
              <div class="pw-wrap"><input class="input" type="password" id="newPassword" autocomplete="new-password" required><button type="button" class="pw-toggle">表示</button></div>
              <p class="hint">8文字以上で、英字と数字を両方含めてください。変更すると、ほかの端末ではログアウトされます。</p>
            </div>
            <div><button class="btn btn-primary" type="submit">パスワードを変更</button></div>
          </form>

          <div class="danger-zone">
            <h3>すべての端末からログアウト</h3>
            <p class="hint mb">ほかの端末で使っているログイン状態もすべて無効にします。</p>
            <button class="btn btn-outline" type="button" id="logout-all">すべての端末からログアウト</button>
          </div>

          <div class="danger-zone">
            <h3>退会（アカウント削除）</h3>
            <p class="hint mb">アカウント、お気に入り、検索履歴、投稿した記事がすべて削除され、元に戻せません。</p>
            <form class="form-grid" id="delete-form" novalidate>
              <p class="alert" id="delete-msg" hidden></p>
              <div class="field">
                <label for="deletePassword">確認のためパスワードを入力</label>
                <input class="input" type="password" id="deletePassword" autocomplete="current-password" required>
              </div>
              <div><button class="btn btn-danger" type="submit">アカウントを削除する</button></div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
