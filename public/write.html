<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/i18n.js" defer></script>
<script src="/js/common.js" defer></script>
<title data-i18n="t_write">体験記を書く｜Solo Travel Japan</title>
<script src="/js/write.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-head">
    <div class="wrap">
      <h1 id="write-title" data-i18n="write_title">体験記を書く</h1>
      <p data-i18n="write_lead">あなたのひとり旅の経験を、これから旅する人に共有しましょう。投稿した記事はブログに公開され、マイページからいつでも編集・削除できます。</p>
    </div>
  </div>
  <div class="wrap section">
    <form class="account-panel form-grid" id="write-form" novalidate hidden>
      <p class="alert alert-error" id="write-error" hidden></p>
      <div class="field">
        <label for="title" data-i18n="f_title">タイトル（4〜80文字）</label>
        <input class="input" id="title" name="title" maxlength="80" required>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="category" data-i18n="category">カテゴリ</label>
          <select class="select" id="category" name="category">
            <option value="experience" data-i18n="pcat_experience">体験記</option><option value="solo" data-i18n="pcat_solo">ひとり旅</option><option value="tips" data-i18n="pcat_tips">旅のコツ</option><option value="gourmet" data-i18n="pcat_gourmet">グルメ</option><option value="sightseeing" data-i18n="pcat_sightseeing">観光</option>
          </select>
        </div>
        <div class="field">
          <label for="region" data-i18n="f_region">エリア</label>
          <select class="select" id="region" name="region"><option value="" data-i18n="not_set">指定しない</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="lang" data-i18n="post_lang">記事の言語</label>
          <select class="select" id="lang" name="lang">
            <option value="ja">日本語</option><option value="vi">Tiếng Việt</option><option value="en">English</option>
          </select>
        </div>
        <div class="field">
          <label for="season" data-i18n="season">季節</label>
          <select class="select" id="season" name="season">
            <option value="all" data-i18n="season_all">通年</option><option value="spring" data-i18n="season_spring">春</option><option value="summer" data-i18n="season_summer">夏</option><option value="autumn" data-i18n="season_autumn">秋</option><option value="winter" data-i18n="season_winter">冬</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="excerpt" data-i18n="f_excerpt">概要（任意・140文字まで）</label>
        <input class="input" id="excerpt" name="excerpt" maxlength="140" placeholder="空欄なら本文の冒頭を使います" data-i18n-ph="f_excerpt_ph">
      </div>
      <fieldset class="field">
        <legend class="hint" data-i18n="f_cover">カバー画像</legend>
        <div class="cover-pick" id="covers"></div>
      </fieldset>
      <div class="field">
        <div class="result-bar">
          <label for="body" data-i18n="f_body">本文（30〜8,000文字）</label>
          <div class="chips" role="group" aria-label="表示切替" data-i18n-aria="view_toggle">
            <button type="button" class="chip" id="mode-edit" aria-pressed="true" data-i18n="mode_edit">編集</button>
            <button type="button" class="chip" id="mode-preview" aria-pressed="false" data-i18n="mode_preview">プレビュー</button>
          </div>
        </div>
        <textarea class="textarea" id="body" name="body" maxlength="8000" required data-i18n-ph="body_ph" placeholder="## 見出し&#10;段落は空行で区切ります。&#10;- 箇条書きは「- 」で始めます&#10;**太字** も使えます"></textarea>
        <div class="editor-preview prose" id="preview" hidden></div>
        <p class="hint"><span id="char-count">0</span> / 8,000 ・ <span data-i18n="body_hint">「## 」で見出し、「- 」で箇条書き、「**文字**」で太字になります。</span></p>
      </div>
      <div class="post-actions">
        <button class="btn btn-primary btn-lg" type="submit" id="submit-btn" data-i18n="publish">投稿する</button>
        <a class="btn btn-ghost" href="/blog" id="cancel-link" data-i18n="cancel">キャンセル</a>
      </div>
    </form>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
