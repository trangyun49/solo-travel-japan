<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js" defer></script>
<title>体験記を書く｜ひとり旅ジャパン</title>
<script src="/js/write.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-head">
    <div class="wrap">
      <h1 id="write-title">体験記を書く</h1>
      <p>あなたのひとり旅の経験を、これから旅する人に共有しましょう。投稿した記事はブログに公開され、マイページからいつでも編集・削除できます。</p>
    </div>
  </div>
  <div class="wrap section">
    <form class="account-panel form-grid" id="write-form" novalidate hidden>
      <p class="alert alert-error" id="write-error" hidden></p>
      <div class="field">
        <label for="title">タイトル（4〜80文字）</label>
        <input class="input" id="title" name="title" maxlength="80" required>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="category">カテゴリ</label>
          <select class="select" id="category" name="category">
            <option value="experience">体験記</option><option value="solo">ひとり旅</option><option value="tips">旅のコツ</option><option value="gourmet">グルメ</option><option value="sightseeing">観光</option>
          </select>
        </div>
        <div class="field">
          <label for="region">エリア</label>
          <select class="select" id="region" name="region"><option value="">指定しない</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="season">季節</label>
          <select class="select" id="season" name="season">
            <option value="all">通年</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option><option value="winter">冬</option>
          </select>
        </div>
        <div class="field">
          <label for="excerpt">概要（任意・140文字まで）</label>
          <input class="input" id="excerpt" name="excerpt" maxlength="140" placeholder="空欄なら本文の冒頭を使います">
        </div>
      </div>
      <fieldset class="field">
        <legend class="hint">カバー画像</legend>
        <div class="cover-pick" id="covers"></div>
      </fieldset>
      <div class="field">
        <div class="result-bar">
          <label for="body">本文（30〜8,000文字）</label>
          <div class="chips" role="group" aria-label="表示切替">
            <button type="button" class="chip" id="mode-edit" aria-pressed="true">編集</button>
            <button type="button" class="chip" id="mode-preview" aria-pressed="false">プレビュー</button>
          </div>
        </div>
        <textarea class="textarea" id="body" name="body" maxlength="8000" required placeholder="## 見出し&#10;段落は空行で区切ります。&#10;- 箇条書きは「- 」で始めます&#10;**太字** も使えます"></textarea>
        <div class="editor-preview prose" id="preview" hidden></div>
        <p class="hint"><span id="char-count">0</span> / 8,000文字　「## 」で見出し、「- 」で箇条書き、「**文字**」で太字になります。</p>
      </div>
      <div class="post-actions">
        <button class="btn btn-primary btn-lg" type="submit" id="submit-btn">投稿する</button>
        <a class="btn btn-ghost" href="/blog" id="cancel-link">キャンセル</a>
      </div>
    </form>
  </div>
</main>
<div id="site-footer"></div>
</body>
</html>
